name: Build Windows Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JasperEngine Editor (Windows x64)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      EDITOR_TESTS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Restore ccache
        uses: ./.github/actions/ccache-restore
        with:
          lane: windows
          max-size: 2G

      - name: Build editor
        run: tools/ci/windows.sh editor

      - name: Build player runtimes (d3d11 + glcore, release)
        run: |
          for backend in d3d11 glcore; do
            tools/ci/players-windows.sh "$backend"
          done

      - name: Put the runtimes next to the editor
        run: |
          mkdir -p instdir/bin/players
          cp -r build/players/windows-x64-* instdir/bin/players/
          ls -la instdir/bin/players

      - name: Upload editor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JasperEngine-Windows-x64
          path: instdir/bin/
          if-no-files-found: error
          retention-days: 7
